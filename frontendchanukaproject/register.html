<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0284c7;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 { font-size: 28px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 15px; margin-bottom: 22px; }

    label { display: block; font-size: 15px; font-weight: 600; color: #222; margin: 14px 0 6px; }

    input, select {
      width: 100%;
      padding: 14px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: #0ea5e9; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #0ea5e9;
      background: #0091d6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button:hover { background: #0284c7; }

    #message { margin-top: 14px; font-size: 14px; font-weight: 600; min-height: 18px; }

    .footer { margin-top: 14px; font-size: 13px; color: #6b7280; }
    .footer a { color: #0091d6; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Join our marketplace as a buyer or seller.</p>

    <form id="registerForm">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" required>

      <label for="email">Email address</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <label for="role">Account type</label>
      <select id="role" required>
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
      </select>

      <button type="submit" id="registerButton">Create Account</button>
      <p id="message"></p>
    </form>

    <p class="footer">Already registered? <a href="login.html">Log in</a></p>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const button = document.getElementById('registerButton');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      button.disabled = true;
      message.textContent = 'Creating your account...';
      message.style.color = '#0091d6';

      const full_name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name, role } }
        });
        if (error) throw error;

        if (data.user) {
          await supabase.from('profiles').insert({
            id: data.user.id,
            full_name,
            role
          });
        }

        message.style.color = 'green';
        message.textContent = 'Account created! Check email or login.';
        form.reset();

      } catch (err) {
        message.style.color = 'red';
        message.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
