<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Chanuka Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#ffffff;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;border:2px solid #000000;border-radius:12px;padding:24px;margin-top:40px;background:#ffffff}
h2{margin:0 0 18px 0;font-size:20px;color:#000000;text-align:center}
input{width:100%;padding:14px;border:2px solid #000000;border-radius:8px;font-size:16px;margin-bottom:12px}
button{width:100%;padding:14px;background:#000000;color:#FFCC00;border:2px solid #000000;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
#msg{margin-top:14px;font-size:14px;text-align:center;min-height:18px}
.error{color:#ff0000}
.success{color:#008000}
</style>
</head>
<body>
<div class="card">
<h2>Forgot Password</h2>
<input id="email" type="email" placeholder="Enter your email">
<button id="btn" type="button">Send Reset Link</button>
<p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const supabaseClient = supabase.createClient(
 'https://altpysljcjifckilnomq.supabase.co',
 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdHB5c2psY2ppZmNraWxub21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzE4MzUsImV4cCI6MjEwNzc0NzgzNX0.0RCw5vL0feVA_k4hVD_0Rw3HetXHI0lnntmfNYuxBXI'
)

document.getElementById('btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim()
  const msg = document.getElementById('msg')
  const btn = document.getElementById('btn')
  
  if(!email){ msg.className='error'; msg.innerText='Enter email'; return }
  
  btn.disabled=true
  btn.innerText='Sending...'
  msg.innerText=''
  
  try{
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email)
    if(error) throw error
    msg.className='success'
    msg.innerText='Check your email (and spam). Link sent!'
    btn.innerText='Sent'
  }catch(e){
    msg.className='error'
    msg.innerText=e.message
    console.log(e)
    btn.disabled=false
    btn.innerText='Send Reset Link'
  }
})
</script>
</body>
</html>
