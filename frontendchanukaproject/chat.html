<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanuka Market - Escrow Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-12">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center max-w-2xl mx-auto rounded-b-2xl">
        <a href="index.html" class="bg-blue-600 text-white p-2 rounded-xl text-sm font-bold flex items-center">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back to Store
        </a>
        <h1 class="font-bold text-lg text-blue-900">Chanuka <span class="text-amber-500">-market</span></h1>
    </header>

    <main class="max-w-2xl mx-auto mt-4 px-3 space-y-4">
        <!-- Product Details Header -->
        <div class="bg-white p-4 rounded-2xl shadow space-y-3">
            <div class="flex gap-3 items-center">
                <img id="p-img" src="" class="w-16 h-16 object-cover rounded-xl bg-gray-200">
                <div>
                    <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">ORDER ACTIVE</span>
                    <h2 id="p-title" class="font-bold text-gray-800">Loading...</h2>
                    <p class="text-sm font-bold text-green-600" id="p-price">KSh 0</p>
                    <p class="text-xs text-gray-500">Seller: <span id="p-seller" class="font-semibold">Merchant</span></p>
                </div>
            </div>
            <div class="bg-blue-50 p-2.5 rounded-xl text-xs text-blue-800 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-blue-600 text-base"></i>
                <span>Payment held safely in <strong>Chanuka Escrow Vault</strong>. Funds release only after delivery.</span>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="bg-white rounded-2xl shadow flex flex-col h-[450px]">
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                <div class="text-center text-xs text-gray-400 my-2">Connecting to secure chat...</div>
            </div>
            <form id="chat-form" class="p-3 border-t flex gap-2">
                <input id="chat-input" type="text" placeholder="Type a message to seller..." class="flex-1 bg-gray-100 border-0 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl hover:bg-blue-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>
    <script>
// Supabase Configuration
const SUPABASE_URL = "https://altpysjlcjifckilnomq.supabase.co";

// REPLACE THIS WITH YOUR VALID KEY FROM SUPABASE DASHBOARD -> PROJECT SETTINGS -> API
const SUPABASE_KEY = "sb_publishable_kpkKcjiQck7a3hNzqxJtmw_dFJOAV-8"; 

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Extract URL parameters passed from product click
const params = new URLSearchParams(window.location.search);
const productName = params.get('product') || 'Selected Goods';
const price = params.get('price') || '0';
const seller = params.get('seller') || 'Merchant Store';
const image = params.get('image') || 'https://via.placeholder.com/100';
const senderRole = params.get('role') === 'seller' ? 'seller' : 'buyer';

// Populate UI headers
document.getElementById('p-title').innerText = productName;
document.getElementById('p-price').innerText = 'KSh ' + Number(price).toLocaleString();
document.getElementById('p-seller').innerText = seller;
document.getElementById('p-img').src = image;

let chatId = null;

function renderMessage(msg) {
    const box = document.getElementById('chat-messages');
    const isMe = msg.sender === senderRole;
    const div = document.createElement('div');
    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `
        <div class="max-w-[75%] p-3 rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none'}">
            <p>${msg.text}</p>
            <span class="text-[10px] opacity-70 block text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function initChat() {
    try {
        // 1. Find or create a unique chat room for this product & seller combination
        let { data: existingChat, error: fetchErr } = await client
            .from('chats')
            .select('*')
            .eq('product_name', productName)
            .eq('seller_name', seller)
            .maybeSingle();

        if (existingChat) {
            chatId = existingChat.id;
        } else {
            let { data: newChat, error: insertErr } = await client
                .from('chats')
                .insert([{ 
                    product_name: productName, 
                    price: price, 
                    seller_name: seller, 
                    last_message: 'Chat started' 
                }])
                .select()
                .single();
                
            if (insertErr) throw insertErr;
            chatId = newChat.id;
        }

        // 2. Load existing messages
        await loadMessages();

        // 3. Setup Supabase Realtime Subscription for instant message updates
        client.channel('public:messages:chat_id=eq.' + chatId)
            .on('postgres_changes', { 
                event: 'INSERT', 
                schema: 'public', 
                table: 'messages', 
                filter: `chat_id=eq.${chatId}` 
            }, payload => {
                if (payload.new.sender !== senderRole) {
                    renderMessage(payload.new);
                }
            })
            .subscribe();

    } catch (e) {
        console.error(e);
        alert('Chat initialization error: ' + e.message);
    }
}

async function loadMessages() {
    const { data } = await client
        .from('messages')
        .select('*')
        .eq('chat_id', chatId)
        .order('created_at', { ascending: true });
        
    const box = document.getElementById('chat-messages');
    box.innerHTML = '<div class="text-center text-xs text-gray-400 my-2">Escrow Protection Active - Private & Encrypted</div>';
    data?.forEach(renderMessage);
}

// Send Message Handler
document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !chatId) return;

    input.value = '';
    const tempTime = new Date().toISOString();

    // Instant local UI feedback
    renderMessage({ sender: senderRole, text: text, created_at: tempTime });

    // Insert message into Supabase messages table
    const { error } = await client.from('messages').insert([{ 
        chat_id: chatId, 
        sender: senderRole, 
        text: text 
    }]);

    if (error) {
        console.error(error);
        alert('Failed to send message: ' + error.message);
        return;
    }

    // Update the last message preview in the chats table
    await client.from('chats').update({ last_message: text }).eq('id', chatId);
});

// Run initialization on load
initChat();
                </script>
