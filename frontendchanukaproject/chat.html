<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanuka Market - Escrow Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center max-w-2xl mx-auto rounded-b-2xl">
        <a href="index.html" class="bg-blue-600 text-white p-2 rounded-xl text-sm font-bold">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back to Store
        </a>
        <h1 class="font-bold text-lg text-blue-900">Chanuka <span class="text-amber-500">-market</span></h1>
    </header>

    <main class="max-w-2xl mx-auto mt-4 px-3 space-y-4">

        <!-- Product Card Header -->
        <div class="bg-white p-4 rounded-2xl shadow space-y-3">
            <div class="flex gap-3 items-center">
                <img id="p-img" src="" class="w-16 h-16 object-cover rounded-xl bg-gray-200">
                <div>
                    <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">ORDER ACTIVE</span>
                    <h2 id="p-title" class="font-bold text-gray-800">Loading product...</h2>
                    <p class="text-sm font-bold text-green-600" id="p-price">KSh 0</p>
                    <p class="text-xs text-gray-500">Seller: <span id="p-seller" class="font-semibold text-gray-700">Merchant</span></p>
                </div>
            </div>
            <div class="bg-blue-50 p-2.5 rounded-xl text-xs text-blue-800 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-blue-600 text-base"></i>
                <span>Payment held safely in <strong>Chanuka Escrow Vault</strong>. Funds release only after delivery.</span>
            </div>
        </div>

        <!-- Real-time Chat Box -->
        <div class="bg-white rounded-2xl shadow flex flex-col h-[450px]">
            <!-- Chat Messages Container -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                <div class="text-center text-xs text-gray-400 my-2">Chat connected & protected by Chanuka Escrow</div>
            </div>

            <!-- Input Bar -->
            <form id="chat-form" class="p-3 border-t flex gap-2">
                <input id="chat-input" type="text" placeholder="Type a message to seller..." class="flex-1 bg-gray-100 border-0 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl hover:bg-blue-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
      // Replace with your actual Supabase Project URL and Anon Key
const SUPABASE_URL = "https://your-project-id.supabase.co";
const SUPABASE_KEY = "your-supabase-anon-key";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const productName = params.get('product') || 'Selected Goods';
        const price = params.get('price') || '0';
        const seller = params.get('seller') || 'Merchant Store';
        const image = params.get('image') || 'https://via.placeholder.com/100';

        // Display Product Info on UI
        document.getElementById('p-title').innerText = productName;
        document.getElementById('p-price').innerText = 'KSh ' + Number(price).toLocaleString();
        document.getElementById('p-seller').innerText = seller;
        document.getElementById('p-img').src = image;

        let chatId = null;

        async function initChat() {
            // 1. Find or create a chat for this product & seller
            let { data: existingChat } = await supabase
                .from('chats')
                .select('*')
                .eq('product_name', productName)
                .eq('seller_name', seller)
                .single();

            if (existingChat) {
                chatId = existingChat.id;
            } else {
                let { data: newChat } = await supabase
                    .from('chats')
                    .insert([{ product_name: productName, price: price, seller_name: seller }])
                    .select()
                    .single();
                chatId = newChat.id;
            }

            // 2. Load Old Messages
            loadMessages();

            // 3. Listen for Live Seller Responses (Supabase Realtime)
            supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, payload => {
                    renderMessage(payload.new);
                })
                .subscribe();
        }

        async function loadMessages() {
            const { data: messages } = await supabase
                .from('messages')
                .select('*')
                .eq('chat_id', chatId)
                .order('created_at', { ascending: true });

            const box = document.getElementById('chat-messages');
            box.innerHTML = '<div class="text-center text-xs text-gray-400 my-2">Escrow Protection Active</div>';
            messages?.forEach(renderMessage);
        }

        function renderMessage(msg) {
            const box = document.getElementById('chat-messages');
            const isBuyer = msg.sender === 'buyer';
            const div = document.createElement('div');
            div.className = `flex ${isBuyer ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="max-w-[75%] p-3 rounded-2xl ${isBuyer ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none'}">
                    <p>${msg.text}</p>
                    <span class="text-[10px] opacity-70 block text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Send Message Handler
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !chatId) return;

            input.value = '';
            await supabase.from('messages').insert([{ chat_id: chatId, sender: 'buyer', text }]);
        });

        initChat();
    </script>
</body>
</html>
