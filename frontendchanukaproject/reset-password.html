<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;background:#FFF;display:flex;justify-content:center;padding:20px;}
    .card{background:white;border:1px solid #E5E7EB;border-radius:12px;padding:20px;width:100%;max-width:360px;margin-top:40px;}
    input{width:100%;padding:12px;border:1px solid #E5E7EB;border-radius:8px;margin:10px 0;box-sizing:border-box;}
    button{background:#0F172A;color:white;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer;}
    button:disabled{background:#9CA3AF;}
  </style>
</head>
<body>
  <div class="card">
    <h3 style="color:#000;">Set New Password</h3>
    <p id="status" style="font-size:12px;color:#6B7280;">Checking reset link...</p>
    <input id="newpass" type="password" placeholder="New password (min 6 chars)">
    <input id="confirmpass" type="password" placeholder="Confirm password">
    <button id="btn" onclick="updatePass()" disabled>Update Password</button>
    <p id="msg" style="font-size:13px;margin-top:10px;"></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://altpysjlcjifckilnomq.supabase.co'
  const SUPABASE_KEY = 'YOUR_ANON_KEY'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  let sessionReady = false

  // 1. Listen for the recovery session from the email link
  supabase.auth.onAuthStateChange(async (event, session) => {
    console.log(event, session)
    if (event === 'PASSWORD_RECOVERY') {
      document.getElementById('status').innerText = "✅ Link verified. You can now set new password."
      document.getElementById('status').style.color = "green"
      document.getElementById('btn').disabled = false
      sessionReady = true
    }
  })

  // 2. Also check if session already exists (if user refreshed)
  async function checkSession(){
    const { data } = await supabase.auth.getSession()
    if(data.session){
      document.getElementById('status').innerText = "✅ Link verified. You can now set new password."
      document.getElementById('status').style.color = "green"
      document.getElementById('btn').disabled = false
      sessionReady = true
    } else {
      // Wait 2 seconds, if still no session, link is invalid/expired
      setTimeout(() => {
        if(!sessionReady){
          document.getElementById('status').innerText = "❌ Link invalid or expired. Please request new reset link."
          document.getElementById('status').style.color = "red"
        }
      }, 3000)
    }
  }
  checkSession()

  // 3. Update password
  async function updatePass(){
    const p1 = document.getElementById('newpass').value
    const p2 = document.getElementById('confirmpass').value
    const msg = document.getElementById('msg')

    if(p1.length < 6){ msg.innerText = "Password must be at least 6 characters"; return; }
    if(p1 !== p2){ msg.innerText = "Passwords don't match"; return; }

    msg.innerText = "Updating..."
    const { error } = await supabase.auth.updateUser({ password: p1 })

    if(error){
      msg.innerText = "Error: " + error.message
      msg.style.color = "red"
    } else {
      msg.innerText = "✅ Password updated! Redirecting to login..."
      msg.style.color = "green"
      await supabase.auth.signOut()
      setTimeout(()=> window.location.href="login.html", 2000)
    }
  }
</script>
</body>
</html>
