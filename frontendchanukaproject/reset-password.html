<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Chanuka</title>
<style>
body{font-family:Arial;background:#fff;display:flex;justify-content:center;padding:20px;margin:0}
.card{border:1.5px solid #000;border-radius:14px;padding:22px;width:100%;max-width:360px;margin-top:40px}
h3{margin:0 0 15px 0}
input{width:100%;padding:13px;border:1.5px solid #000;border-radius:10px;margin:8px 0;box-sizing:border-box;font-size:16px}
#btn{background:#000;color:#FACC15;border:none;padding:15px;width:100%;border-radius:10px;font-weight:bold;font-size:17px;cursor:pointer;margin-top:10px}
#btn:active{transform:scale(0.98)}
#msg{font-size:14px;margin-top:12px;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h3>Reset Password</h3>
<input id="newpass" type="password" placeholder="New password">
<input id="confirm" type="password" placeholder="Confirm password">
<button id="btn" type="button">Update Password</button>
<p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
// --- PASTE YOUR KEYS HERE ---
const SUPABASE_URL = 'https://altpysljcjifckilnomq.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdHB5c2xqY2ppZmNraWxub21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0OTYzNTgsImV4cCI6MjA3ODA3MjM1OH0.1N0vC5fP8v7a9_example_REPLACE_WITH_YOUR_REAL_KEY'

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Exchange code if present in URL
;(async () => {
  try {
    if(window.location.href.includes('code=')){
      await supabaseClient.auth.exchangeCodeForSession(window.location.href)
      document.getElementById('msg').innerText = 'Link verified - you can now update'
      document.getElementById('msg').style.color='green'
    }
  } catch(e){ console.log(e) }
})()

// BUTTON CLICK - ALWAYS WORKS
document.getElementById('btn').addEventListener('click', async () => {
  const p1 = document.getElementById('newpass').value
  const p2 = document.getElementById('confirm').value
  const msg = document.getElementById('msg')

  if(p1.length < 6){ msg.innerText='Password must be 6+ characters'; msg.style.color='red'; return; }
  if(p1 !== p2){ msg.innerText='Passwords do not match'; msg.style.color='red'; return; }

  msg.innerText='Updating...'; msg.style.color='black'
  
  const { error } = await supabaseClient.auth.updateUser({ password: p1 })
  
  if(error){
    msg.style.color='red'
    msg.innerText='Error: ' + error.message
  } else {
    msg.style.color='green'
    msg.innerText='✅ Password changed! Redirecting to login...'
    setTimeout(()=> window.location.href='login.html', 1500)
  }
})
</script>
</body>
</html>
