<body>

<script>
const supabaseClient = supabase.createClient(
 'https://altpysljcjifckilnomq.supabase.co',

)

;(async()=>{
  const msgEl = document.getElementById('msg')
  const hasCode = window.location.href.includes('code=') || window.location.hash.includes('access_token')
  
  if(!hasCode){
    msgEl.style.color='red'
    msgEl.innerText='No reset code found! Please click the link from your email. Do not type this page directly.'
    return
  }
  
  if(window.location.href.includes('code=')){
    const { error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href)
    if(error){
      msgEl.innerText='Link expired or already used. Request a new one.'
      msgEl.style.color='red'
    } else {
      msgEl.innerText='Link verified! Enter new password.'
      msgEl.style.color='green'
    }
  }
})()
