<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#fff;display:flex;justify-content:center;padding:20px}
.card{border:1px solid #000;border-radius:12px;padding:20px;width:100%;max-width:360px;margin-top:30px}
input{width:100%;padding:12px;border:1px solid #000;border-radius:8px;margin:8px 0;box-sizing:border-box}
button{background:#000;color:#FACC15;border:none;padding:14px;width:100%;border-radius:8px;font-weight:bold;font-size:16px}
#msg{font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h3>Reset Password</h3>
<input id="newpass" type="password" placeholder="New password">
<input id="confirm" type="password" placeholder="Confirm password">
<button onclick="resetNow()">Update Password</button>
<p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// REPLACE WITH YOUR REAL KEYS FROM Settings -> API
const URL = 'https://altpysljcjifckilnomq.supabase.co'
const KEY = 'YOUR_ANON_KEY_HERE'

const supabase = window.supabase.createClient(URL, KEY)

// FIX FOR NEW SUPABASE FLOW
async function prepare(){
  const url = window.location.href
  // If link has ?code= we must exchange it
  if(url.includes('code=')){
    await supabase.auth.exchangeCodeForSession(url)
  }
}
prepare()

async function resetNow(){
  const p1 = document.getElementById('newpass').value
  const p2 = document.getElementById('confirm').value
  const msg = document.getElementById('msg')
  
  if(p1.length < 6){ msg.innerText='Password must be 6+ chars'; return; }
  if(p1 !== p2){ msg.innerText='Passwords dont match'; return; }
  
  msg.innerText = 'Updating...'
  const { error } = await supabase.auth.updateUser({ password: p1 })
  
  if(error){
    msg.style.color='red'
    msg.innerText = 'Error: ' + error.message + '\n\nTry: 1. Request NEW email 2. Open link in same browser'
  } else {
    msg.style.color='green'
    msg.innerText='✅ Success! Going to login...'
    setTimeout(()=> location.href='login.html', 2000)
  }
}
</script>
</body>
</html>
