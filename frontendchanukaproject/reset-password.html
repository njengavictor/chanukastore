<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Chanuka Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#ffffff;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;border:2px solid #000000;border-radius:12px;padding:24px;margin-top:40px;background:#ffffff}
h2{margin:0 0 18px 0;font-size:20px;color:#000000;text-align:center}
.input-wrap{position:relative; margin-bottom:12px;}
.input-wrap input{margin-bottom:0}
input{width:100%;padding:14px 40px 14px 14px;border:2px solid #000000;border-radius:8px;font-size:16px;outline:none}
input:focus{border-color:#000000;background:#ffffff}
.eye-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px;}
button#btn{width:100%;padding:14px;background:#000000;color:#FFCC00;border:2px solid #000000;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button#btn:disabled{background:#cccccc;color:#666666;border-color:#cccccc;cursor:not-allowed}
#msg{margin-top:14px;font-size:14px;text-align:center;min-height:18px}
.success{color:#008000}
.error{color:#ff0000}
.link{margin-top:12px;text-align:center}
.link a{color:#000000;font-size:14px;text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<h2>Reset Password</h2>

<div class="input-wrap">
  <input id="newpass" type="password" placeholder="New password (min 6 chars)">
  <button type="button" class="eye-btn" onclick="togglePass('newpass', this)">👁️</button>
</div>
<div class="input-wrap">
  <input id="confirm" type="password" placeholder="Confirm new password">
  <button type="button" class="eye-btn" onclick="togglePass('confirm', this)">👁️</button>
</div>

<button id="btn" type="button">Update Password</button>
<p id="msg"></p>
<div class="link"><a href="login.html">Back to Login</a></div>
</div>

<script>
function togglePass(id, btn){
  const input = document.getElementById(id);
  if(input.type === 'password'){ input.type='text'; btn.textContent='🙈'; }
  else { input.type='password'; btn.textContent='👁️'; }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://altpysljcjifckilnomq.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdHB5c2psY2ppZmNraWxub21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzE4MzUsImV4cCI6MjEwNzc0NzgzNX0.0RCw5vL0feVA_k4hVD_0Rw3HetXHI0lnntmfNYuxBXI'

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const msg = document.getElementById('msg')
const btn = document.getElementById('btn')

// Check session on load
;(async () => {
  msg.innerText='Verifying reset link...'
  
  try{
    // Handle both ?code= PKCE flow and #access_token hash flow
    if(window.location.href.includes('code=')){
      const { data, error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href)
      if(error) throw error
    }
    
    const { data: { session }, error: sessErr } = await supabaseClient.auth.getSession()
    if(sessErr) throw sessErr

    if(session){
      msg.className='success'
      msg.innerText='Link verified. Enter new password.'
      btn.disabled = false
    } else {
      throw new Error('no session')
    }
  }catch(e){
    msg.className='error'
    msg.innerText='Link expired or already used. Go to forgot-password.html to request a new email. Error: ' + e.message
    btn.disabled = true
  }
})()

btn.addEventListener('click', async () => {
  const p1 = document.getElementById('newpass').value.trim()
  const p2 = document.getElementById('confirm').value.trim()

  if(p1.length < 6){ msg.className='error'; msg.innerText='Password must be at least 6 characters'; return }
  if(p1 !== p2){ msg.className='error'; msg.innerText='Passwords do not match'; return }

  btn.disabled = true
  btn.innerText = 'Updating...'
  msg.className=''
  msg.innerText=''

  const { error } = await supabaseClient.auth.updateUser({ password: p1 })

  if(error){
    msg.className='error'
    msg.innerText='Error: ' + error.message
    btn.disabled = false
    btn.innerText='Update Password'
  } else {
    msg.className='success'
    msg.innerText='Password changed! Redirecting to login...'
    // Sign out so they login with new password
    await supabaseClient.auth.signOut()
    setTimeout(()=> window.location.href='login.html', 1500)
  }
})
</script>
</body>
</html>
