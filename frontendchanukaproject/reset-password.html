<!DOCTYPE html>
<html>
<body style="font-family:Arial;display:flex;justify-content:center;padding:20px;">
  <div style="background:white;border:1px solid #E5E7EB;border-radius:12px;padding:20px;width:100%;max-width:360px;margin-top:40px;">
    <h3>Set New Password</h3>
    <input id="newpass" type="password" placeholder="New password" style="width:100%;padding:12px;border:1px solid #E5E7EB;border-radius:8px;margin:10px 0;">
    <button onclick="updatePass()" style="background:#0F172A;color:white;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;">Update Password</button>
    <p id="msg"></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = window.supabase.createClient('https://altpysjlcjifckilnomq.supabase.co','sb_publishable_kpkKcjiQck7a3hNzqxJtmw_dFJOAV-8')
  
  async function updatePass(){
    const newPassword = document.getElementById('newpass').value
    const { error } = await supabase.auth.updateUser({ password: newPassword })
    if(error){
      document.getElementById('msg').innerText = error.message
    } else {
      document.getElementById('msg').innerText = "✅ Password updated! Redirecting to login..."
      setTimeout(()=> window.location.href="login.html", 2000)
    }
  }
</script>
</body>
</html>
