<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell on Chanuka Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial; margin:0; background:#f5f7fb; }
  .sell-wrapper { max-width:550px; margin:30px auto; padding:20px; }
  .sell-card { background:white; padding:25px; border-radius:16px; box-shadow:0 5px 20px rgba(0,0,0,0.1); margin-bottom:20px; }
  .sell-card input, .sell-card textarea, .sell-card select { width:100%; padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:10px; font-size:16px; box-sizing:border-box; }
  .sell-card button { width:100%; padding:15px; background:#0a58ff; color:white; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; }
  .hidden { display:none; }
</style>
</head>
<body>

<div class="sell-wrapper">
  <a href="index.html" style="text-decoration:none; color:#0a58ff;">← Back to Market</a>

  <!-- SELLER LOGIN - makes inbox private -->
  <div id="loginCard" class="sell-card" style="border:2px solid #0a58ff;">
    <h3 style="text-align:center;">🔒 My Seller Dashboard</h3>
    <p style="text-align:center;font-size:13px;color:#666;">Enter your shop name/phone to see ONLY your buyer chats</p>
    <input type="text" id="shopNameInput" placeholder="Your Shop Name e.g. Jameson Distributors">
    <input type="tel" id="shopPhoneInput" placeholder="Your M-Pesa Phone 07...">
    <button onclick="loginSeller()">Login to My Inbox</button>
  </div>

  <!-- PRIVATE INBOX - only for logged seller -->
  <div id="inboxCard" class="sell-card hidden" style="border:2px solid #0a58ff;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>💬 My Buyer Messages</h3>
      <button onclick="logoutSeller()" style="width:auto;padding:6px 12px;background:#eee;color:#333;font-size:12px;">Logout</button>
    </div>
    <p style="font-size:12px;color:#666;">Shop: <b id="myShopDisplay"></b> - only you see these</p>
    <div id="inboxList">Loading...</div>
    <button onclick="loadInbox()" style="background:#eef2ff;color:#0a58ff;margin-top:10px;padding:8px;font-size:13px;">🔄 Refresh</button>
  </div>

  <!-- PUBLIC SELL FORM -->
  <div class="sell-card">
    <h2 style="text-align:center;">Start Selling on Chanuka</h2>
    <p style="text-align:center;color:#666;font-size:14px;">Sell your products - BEI YAKO BEI POA!</p>
    <form id="sellForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Your M-Pesa Phone 07..." required>
      <input type="text" id="product" placeholder="Product Name" required>
      <input type="number" id="price" placeholder="Price in KSH" required>
      <select id="category" required><option value="">Select Category</option><option>Electronics</option><option>Fashion</option><option>Beauty products</option><option>Food Stuff</option><option>Furniture</option><option>Books & Stationery</option></select>
      <textarea id="desc" rows="3" placeholder="Describe product..."></textarea>
      <button type="submit" id="submitBtn">Send Request to Admin</button>
    </form>
    <a id="whatsappDirect" style="display:block;text-align:center;margin-top:15px;padding:14px;background:#25D366;color:white;text-decoration:none;border-radius:10px;font-weight:bold;" href="#" target="_blank">💬 Chat Admin on WhatsApp</a>
  </div>
</div>

<script>
const ADMIN_WHATSAPP = "254114044517";
const SUPABASE_URL = "https://altpysjlcjifckilnomq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdHB5c2psY2ppZmNraWxub21xIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjE3MTgzNSwiZXhwIjoyMTA3NzQ3ODM1fQ.GaRZS3drc_pU_k-GUwH30nftt0HIDZsuYdYW30OYahQ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
document.getElementById("whatsappDirect").href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent("Hi Chanuka Admin, I want to sell")}`;

// PRIVATE LOGIN LOGIC
function loginSeller(){
  const shop = document.getElementById('shopNameInput').value.trim();
  const phone = document.getElementById('shopPhoneInput').value.trim();
  if(!shop){ alert('Enter your shop name'); return; }
  localStorage.setItem('myShopName', shop);
  localStorage.setItem('myShopPhone', phone);
  showInbox();
}
function logoutSeller(){ localStorage.removeItem('myShopName'); location.reload(); }
function showInbox(){
  const shop = localStorage.getItem('myShopName');
  if(!shop) return;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('inboxCard').classList.remove('hidden');
  document.getElementById('myShopDisplay').textContent = shop;
  loadInbox();
}
async function loadInbox(){
  const myShop = localStorage.getItem('myShopName');
  if(!myShop) return;
  const list = document.getElementById('inboxList');
  list.innerHTML = 'Loading...';
  // PRIVATE FILTER: only chats where seller_name contains my shop name
  const { data, error } = await supabaseClient.from('chats').select('*').ilike('seller_name', `%${myShop}%`).order('created_at', {ascending:false});
  if(error){ list.innerHTML = error.message; return; }
  if(!data.length){ list.innerHTML = `<p style="color:#999;text-align:center;padding:20px;">No messages for <b>${myShop}</b> yet.<br>When buyer clicks Chat with Seller on your product, it will appear here private.</p>`; return; }
  list.innerHTML = data.map(c => `
    <div onclick="location.href='chat.html?product=${encodeURIComponent(c.product_name)}&price=${c.price}&seller=${encodeURIComponent(c.seller_name)}&role=seller'" 
    style="padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#f0f7ff">
      <b>${c.product_name}</b> <small style="float:right">${new Date(c.created_at).toLocaleTimeString()}</small>
      <div style="font-size:13px;margin-top:4px;">💬 ${c.last_message || 'New chat'}</div>
      <div style="font-size:11px;color:#0a58ff;margin-top:4px;">Click to reply → private</div>
    </div>`).join('');
}
// Auto-login if already saved
if(localStorage.getItem('myShopName')) showInbox();
// Realtime private updates
supabaseClient.channel('private-chats').on('postgres_changes',{event:'*',schema:'public',table:'chats'},()=>{ if(localStorage.getItem('myShopName')) loadInbox(); }).subscribe();

// SELL FORM
document.getElementById("sellForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const data = { name: document.getElementById("name").value, phone: document.getElementById("phone").value, product: document.getElementById("product").value, price: document.getElementById("price").value, category: document.getElementById("category").value, desc: document.getElementById("desc").value };
  const waMessage = `*NEW SELLER REQUEST*%0AName: ${data.name}%0APhone: ${data.phone}%0AProduct: ${data.product}%0APrice: KSH ${data.price}%0ACategory: ${data.category}%0ADetails: ${data.desc}`;
  window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${waMessage}`, "_blank");
});
</script>
</body>
</html>
