<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell on Chanuka Market</title>
<link rel="stylesheet" href="style.css">
<style>
  html { scroll-behavior: smooth; }
  body { font-family: Arial; margin:0; background:#f5f7fb; }
  .sell-wrapper { max-width:550px; margin:30px auto; padding:20px; }
  .sell-card { background:white; padding:25px; border-radius:16px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
  .sell-card h2 { text-align:center; margin-bottom:5px; }
  .sell-card p { text-align:center; color:#666; font-size:14px; }
  .sell-card input, .sell-card textarea, .sell-card select {
    width:100%; padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:10px; font-size:16px; box-sizing:border-box;
  }
  .sell-card button {
    width:100%; padding:15px; background:#0a58ff; color:white; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;
  }
  .sell-card button:disabled { background:#888; }
  .whatsapp-direct {
    display:block; text-align:center; margin-top:15px; padding:14px; background:#25D366; color:white; text-decoration:none; border-radius:10px; font-weight:bold;
  }
  /* Phone balance */
  @media(max-width:600px){ .sell-wrapper{ margin:10px; padding:10px; } }
</style>
</head>
<body>

<div class="sell-wrapper">
  <a href="index.html" style="text-decoration:none; color:#0a58ff;">← Back to Market</a>
  <div class="sell-card">
    <h2>Start Selling on Chanuka</h2>
    <p>Sell your products to people near you - BEI YAKO BEI POA!</p>

    <form id="sellForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Your M-Pesa Phone 07..." required pattern="0[0-9]{9}">
      <input type="text" id="product" placeholder="Product Name e.g. Red Nike Shoes" required>
      <input type="number" id="price" placeholder="Price in KSH e.g. 2500" required>
      <select id="category" required>
        <option value="">Select Category</option>
        <option>Electronics</option>
        <option>Fashion</option>
        <option>Beauty products</option>
        <option>Food Stuff</option>
        <option>Furniture</option>
        <option>Books & Stationery</option>
      </select>
      <textarea id="desc" rows="3" placeholder="Describe your product..."></textarea>
      
      <button type="submit" id="submitBtn">Send Request to Admin</button>
    </form>

    <p style="margin:20px 0 5px; text-align:center; font-size:13px;">Or chat directly:</p>
    <a id="whatsappDirect" class="whatsapp-direct" href="#" target="_blank">💬 Chat Admin on WhatsApp</a>
    <p id="statusMsg" style="display:none; text-align:center; color:green; margin-top:15px; font-weight:bold;"></p>
  </div>
</div>

<script>
const ADMIN_WHATSAPP = "254114044517"; // CHANGE TO YOUR NUMBER HERE

// Direct WhatsApp button
document.getElementById("whatsappDirect").href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent("Hi Chanuka Admin, I want to sell my products on Chanuka Market")}`;

const form = document.getElementById("sellForm");
const statusMsg = document.getElementById("statusMsg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  
  const data = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    product: document.getElementById("product").value.trim(),
    price: document.getElementById("price").value.trim(),
    category: document.getElementById("category").value,
    desc: document.getElementById("desc").value.trim()
  };

  // Security: Validate phone
  if(!/^0[17][0-9]{8}$/.test(data.phone)){
    alert("Enter valid Safaricom phone 07... or 01...");
    return;
  }

  btn.textContent = "Sending...";
  btn.disabled = true;

  // 1. Try save to your backend (optional)
  try {
    await fetch("http://localhost:3000/request-to-sell", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
  } catch(err){ console.log("Backend offline - will use WhatsApp only"); }

  // 2. ALWAYS redirect to YOUR WhatsApp with seller details - THIS IS THE COMMUNICATION
  const waMessage = `*NEW SELLER REQUEST - CHANUKA MARKET*%0A%0AName: ${data.name}%0APhone: ${data.phone}%0AProduct: ${data.product}%0APrice: KSH ${data.price}%0ACategory: ${data.category}%0ADetails: ${data.desc}%0A%0APlease approve me to sell.`;

  statusMsg.style.display = "block";
  statusMsg.textContent = "✅ Opening your WhatsApp to Admin...";
  
  setTimeout(()=>{
    window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${waMessage}`, "_blank");
    form.reset();
    btn.textContent = "Send Request to Admin";
    btn.disabled = false;
    statusMsg.textContent = "✅ Request sent! Check WhatsApp.";
  }, 800);
});
</script>

</body>
</html>
